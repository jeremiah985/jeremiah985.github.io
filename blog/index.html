<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <!-- 引入 Google 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- 引入 Font Awesome 图标 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 加载动画 -->
    <div id="loader">Loading...</div>

    <header>
        <h1>My Blog</h1>
        <nav>
            <a href="../index.html">Home</a>
        </nav>
    </header>

    <main>
        <section id="blog-form">
            <h2>Create or Edit a Blog Post</h2>
            <form id="blogPostForm">
                <label for="title">Title:</label>
                <input type="text" id="title" placeholder="Enter blog title" required>
                <label for="content">Content:</label>
                <textarea id="content" rows="5" placeholder="Write your content here" required></textarea>
                <button type="submit"><i class="fas fa-save"></i> Save Post</button>
            </form>
        </section>

        <section id="blog-list">
            <h2>Blog Posts</h2>
            <div id="postsContainer" class="card-container"></div>
        </section>
    </main>

    <footer>
        <p>© 2025 Jeremiah985</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
